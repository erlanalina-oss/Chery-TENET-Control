name: Chery TENET Store Auto

on:
  push:
    branches: [main]
    paths:
      - 'store/*.apk'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: chery-tenet-store-auto
  cancel-in-progress: false

jobs:
  update-store:
    runs-on: ubuntu-latest
    steps:
      - name: Check out catalog and APKs
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install APK reader
        run: sdkmanager 'build-tools;35.0.0'

      - name: Update catalog without losing release APKs
        env:
          REPO: ${{ github.repository }}
        run: |
          python3 - <<'PY'
          import datetime
          import hashlib
          import json
          import os
          import pathlib
          import re
          import subprocess
          from urllib.parse import quote

          root = pathlib.Path('store')
          catalog_path = root / 'catalog.json'
          aapt = pathlib.Path(os.environ['ANDROID_HOME']) / 'build-tools/35.0.0/aapt'
          repo = os.environ['REPO']

          # Keep existing GitHub Release entries. These APKs are not present
          # in the store/ directory and must not be deleted on catalog rebuild.
          apps = {}
          release_prefix = 'https://github.com/' + repo + '/releases/download/store-'
          if catalog_path.is_file():
              previous = json.loads(catalog_path.read_text(encoding='utf-8'))
              if previous.get('schemaVersion') != 1 or not isinstance(previous.get('apps'), list):
                  raise RuntimeError('Unexpected store/catalog.json schema')
              for entry in previous['apps']:
                  if not isinstance(entry, dict):
                      continue
                  pkg = entry.get('packageName')
                  if (isinstance(pkg, str) and pkg
                          and isinstance(entry.get('apkUrl'), str)
                          and entry['apkUrl'].startswith(release_prefix)):
                      old = apps.get(pkg)
                      if old is None or int(entry.get('versionCode', 0)) > int(old.get('versionCode', 0)):
                          apps[pkg] = entry

          # Scan APKs physically stored in the repository.
          for apk in sorted(root.glob('*.apk')):
              meta = subprocess.check_output(
                  [str(aapt), 'dump', 'badging', str(apk)],
                  text=True, errors='replace'
              )
              pkg = re.search(
                  r"^package: name='([^']+)' versionCode='(\d+)' versionName='([^']*)'",
                  meta, re.M
              )
              if not pkg:
                  raise RuntimeError('Cannot read APK: ' + str(apk))

              label = (
                  re.search(r"^application-label-ru:'([^']*)'", meta, re.M)
                  or re.search(r"^application-label:'([^']*)'", meta, re.M)
              )
              sdk = re.search(r"^sdkVersion:'(\d+)'", meta, re.M)
              name, code, version = pkg.groups()

              with apk.open('rb') as f:
                  sha = hashlib.file_digest(f, 'sha256').hexdigest()

              app = dict(
                  title=(label.group(1) if label else apk.stem)[:90] or name,
                  packageName=name,
                  versionCode=int(code),
                  versionName=version or code,
                  category='Приложения',
                  description='',
                  apkUrl='https://raw.githubusercontent.com/' + repo + '/main/store/' + quote(apk.name),
                  sha256=sha,
                  sizeBytes=apk.stat().st_size,
                  minSdk=int(sdk.group(1)) if sdk else 1
              )
              old = apps.get(name)
              if old is None or app['versionCode'] > int(old.get('versionCode', 0)):
                  apps[name] = app

          catalog = dict(
              schemaVersion=1,
              storeName='Chery TENET Store',
              updatedAt=datetime.date.today().isoformat(),
              apps=sorted(apps.values(), key=lambda a: a['title'].casefold())
          )
          catalog_path.write_text(
              json.dumps(catalog, ensure_ascii=False, indent=2) + '\n',
              encoding='utf-8'
          )
          print('Applications in catalog:', len(apps))
          print('GitHub Release entries preserved:', sum(
              str(app.get('apkUrl', '')).startswith(release_prefix)
              for app in catalog['apps']
          ))
          PY

      - name: Commit catalog update
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add store/catalog.json
          if ! git diff --cached --quiet; then
            git commit -m 'Update Chery TENET Store catalog (preserve release APKs)'
            git pull --rebase origin main
            git push origin HEAD:main
          else
            echo 'No catalog changes'
          fi
