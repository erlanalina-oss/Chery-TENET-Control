name: Publish approved Chery TENET Control 8.0.1
on:
  push:
    branches: ['publish/8.0.1']
    paths: ['.github/workflows/publish-801.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: chery-tenet-main-app-update
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: v8.0.1
      EXPECTED_SHA: 847078946ae13eee7b0b6a459d2d9f0d72a13b43460902a8e666ec1a58e2f247
      EXPECTED_SIZE: '10217223'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: main
          path: current-main
      - uses: android-actions/setup-android@v4
      - run: sdkmanager 'build-tools;35.0.0'
      - name: Reconstruct approved APK and verify version and signature
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import pathlib, base64, hashlib, os
          files=sorted(pathlib.Path('transfer-801').glob('*.b64'))
          assert [f.name for f in files]==[f'{i:02d}.b64' for i in range(20)]
          apk=b''.join(base64.b64decode(f.read_text(),validate=True) for f in files)
          assert len(apk)==int(os.environ['EXPECTED_SIZE'])
          assert hashlib.sha256(apk).hexdigest()==os.environ['EXPECTED_SHA']
          pathlib.Path(os.environ['RUNNER_TEMP'],'app-release.apk').write_bytes(apk)
          PY
          APK="$RUNNER_TEMP/app-release.apk"
          TOOLS="$ANDROID_HOME/build-tools/35.0.0"
          "$TOOLS/aapt" dump badging "$APK" > "$RUNNER_TEMP/badging"
          grep -F "package: name='com.example.cherytenetcontrol' versionCode='454' versionName='8.0.1'" "$RUNNER_TEMP/badging"
          python3 - "$RUNNER_TEMP/badging" <<'PY'
          import pathlib,re,sys
          s=pathlib.Path(sys.argv[1]).read_text()
          m=re.search(r"^sdkVersion:'(\d+)'",s,re.M)
          assert m and int(m.group(1))<=28
          PY
          "$TOOLS/apksigner" verify --min-sdk-version 28 --print-certs "$APK" > "$RUNNER_TEMP/new-certs"
          gh release download v8.0.0 --repo "$GITHUB_REPOSITORY" --pattern app-release.apk --output "$RUNNER_TEMP/old.apk"
          "$TOOLS/apksigner" verify --min-sdk-version 28 --print-certs "$RUNNER_TEMP/old.apk" > "$RUNNER_TEMP/old-certs"
          grep -F 'certificate SHA-256 digest:' "$RUNNER_TEMP/new-certs" > "$RUNNER_TEMP/new-digest"
          grep -F 'certificate SHA-256 digest:' "$RUNNER_TEMP/old-certs" > "$RUNNER_TEMP/old-digest"
          cmp "$RUNNER_TEMP/new-digest" "$RUNNER_TEMP/old-digest"
          python3 - <<'PY'
          import json,pathlib
          v=json.loads(pathlib.Path('current-main/update.json').read_text())
          assert v['packageName']=='com.example.cherytenetcontrol'
          assert v['versionCode']==453 and v['versionName']=='8.0.0',v
          PY
      - name: Publish verified APK release
        shell: bash
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/notes.txt" <<'NOTES'
          CHERY TENET CONTROL — 8.0.1

          • Исправлен автокомфорт при дистанционном запуске двигателя.
          • При дистанционном запуске учитывается только наружная температура.
          • При обычном запуске сохраняется учёт температуры двигателя.
          • Остальные функции версии 8.0.0 сохранены.

          Обновление для всех пользователей Chery TENET Control.
          NOTES
          gh release create "$RELEASE_TAG" "$RUNNER_TEMP/app-release.apk" --repo "$GITHUB_REPOSITORY" --target main --title "Chery TENET Control 8.0.1" --notes-file "$RUNNER_TEMP/notes.txt" --draft
          gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json assets > "$RUNNER_TEMP/release-draft.json"
          python3 - <<'PY'
          import json,pathlib,os
          a=json.loads(pathlib.Path(os.environ['RUNNER_TEMP'],'release-draft.json').read_text())['assets']
          assert len(a)==1 and a[0]['name']=='app-release.apk' and a[0]['size']==int(os.environ['EXPECTED_SIZE']),a
          PY
          gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --draft=false --latest
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --pattern app-release.apk --output "$RUNNER_TEMP/published.apk"
          echo "$EXPECTED_SHA  $RUNNER_TEMP/published.apk" | sha256sum -c
      - name: Activate update only after verifying published asset
        shell: bash
        run: |
          set -euo pipefail
          cd current-main
          git pull --ff-only origin main
          python3 - <<'PY'
          import json,pathlib,os
          p=pathlib.Path('update.json')
          old=json.loads(p.read_text())
          assert old['packageName']=='com.example.cherytenetcontrol'
          assert old['versionCode']==453 and old['versionName']=='8.0.0',old
          notes=pathlib.Path(os.environ['RUNNER_TEMP'],'notes.txt').read_text().strip()
          d={'packageName':old['packageName'],'versionCode':454,'versionName':'8.0.1','apkUrl':'https://github.com/'+os.environ['GITHUB_REPOSITORY']+'/releases/download/v8.0.1/app-release.apk','sizeBytes':int(os.environ['EXPECTED_SIZE']),'notes':notes,'sha256':os.environ['EXPECTED_SHA']}
          p.write_text(json.dumps(d,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add update.json
          git commit -m 'Publish verified 8.0.1 update for all users'
          git push origin HEAD:main
