name: Chery TENET Control - Publish app updates

on:
  release:
    types: [published, edited]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Published application release tag, e.g. v7.9.265'
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: chery-tenet-main-app-update
  cancel-in-progress: false

jobs:
  publish-main-app:
    if: >-
      (github.event_name == 'workflow_dispatch' && startsWith(inputs.tag, 'v')) ||
      (github.event_name == 'release' && startsWith(github.event.release.tag_name, 'v') && !github.event.release.prerelease && !github.event.release.draft)
    runs-on: ubuntu-latest
    steps:
      - name: Check out current repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android APK inspection tools
        run: sdkmanager 'build-tools;35.0.0'

      - name: Verify APK and generate update.json
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          python3 - <<'PYTHON'
          #!/usr/bin/env python3
          """Publish one validated Chery TENET Control release to update.json.

          Executed by .github/workflows/chery-app-update.yml on GitHub Actions.
          Never alters store/catalog.json or a release asset.
          """

          import hashlib
          import json
          import os
          from pathlib import Path
          import re
          import subprocess
          import tempfile
          from urllib.parse import quote
          from urllib.request import Request, urlopen

          PACKAGE = 'com.example.cherytenetcontrol'
          TAG_PATTERN = re.compile(r'v\d+(?:\.\d+){2,3}', re.ASCII)
          BADGING_PATTERN = re.compile(
              r"^package: name='([^']+)' versionCode='(\d+)' versionName='([^']*)'",
              re.MULTILINE,
          )


          def load_release(repo, tag, token):
              api = f'https://api.github.com/repos/{repo}/releases/tags/{quote(tag, safe="")}'
              request = Request(api, headers={
                  'Authorization': f'Bearer {token}',
                  'Accept': 'application/vnd.github+json',
                  'X-GitHub-Api-Version': '2022-11-28',
                  'User-Agent': 'CheryTENETControl-AutoUpdate',
              })
              with urlopen(request, timeout=40) as response:
                  return json.load(response)


          def build_metadata(release, repo, tag, aapt, apksigner, previous):
              if release.get('draft') or release.get('prerelease'):
                  raise ValueError('Draft/pre-release updates are not published.')
              if release.get('tag_name') != tag or not TAG_PATTERN.fullmatch(tag):
                  raise ValueError('Release tag must match v7.9.265 (and equal APK versionName).')
              body = (release.get('body') or '').strip()
              if not body:
                  raise ValueError('Release description is empty. Add the list of changes first.')
              if len(body) > 4000:
                  raise ValueError('Release notes are longer than 4000 characters.')
              assets = [a for a in release.get('assets', []) if a.get('name', '').lower().endswith('.apk')]
              if len(assets) != 1:
                  raise ValueError('The application release must contain exactly one APK.')
              asset = assets[0]
              url = asset['browser_download_url']
              if not url.startswith(f'https://github.com/{repo}/releases/download/'):
                  raise ValueError('Unexpected APK download address.')

              with tempfile.TemporaryDirectory(prefix='chery-main-app-') as temporary:
                  apk = Path(temporary) / 'app-release.apk'
                  digest = hashlib.sha256()
                  total = 0
                  with urlopen(Request(url, headers={'User-Agent': 'CheryTENETControl-AutoUpdate'}), timeout=120) as response:
                      with apk.open('wb') as target:
                          while True:
                              chunk = response.read(1024 * 1024)
                              if not chunk:
                                  break
                              target.write(chunk)
                              digest.update(chunk)
                              total += len(chunk)
                  if total != int(asset['size']) or total <= 0:
                      raise ValueError('APK size differs from the GitHub release asset.')
                  sha256 = digest.hexdigest()
                  if asset.get('digest') and asset['digest'].startswith('sha256:'):
                      if sha256 != asset['digest'][7:]:
                          raise ValueError('APK SHA-256 differs from GitHub asset digest.')

                  metadata = subprocess.check_output([str(aapt), 'dump', 'badging', str(apk)], text=True, errors='replace')
                  match = BADGING_PATTERN.search(metadata)
                  if not match:
                      raise ValueError('Cannot read the APK package/version.')
                  package, code, version = match.groups()
                  if package != PACKAGE:
                      raise ValueError(f'Wrong packageName: {package}. Expected {PACKAGE}.')
                  if version != tag[1:]:
                      raise ValueError(f'APK versionName {version!r} differs from release tag {tag!r}.')
                  sdk_match = re.search(r"^sdkVersion:'(\d+)'", metadata, re.MULTILINE)
                  if sdk_match and int(sdk_match.group(1)) > 28:
                      raise ValueError('This APK requires Android newer than 9 (minSdk > 28).')
                  subprocess.run([str(apksigner), 'verify', '--min-sdk-version', '28', str(apk)], check=True)

              version_code = int(code)
              previous_code = int(previous.get('versionCode', 0))
              if version_code < previous_code:
                  raise ValueError(f'Refusing downgrade from versionCode {previous_code} to {version_code}.')
              if version_code == previous_code and previous.get('sha256') != sha256:
                  raise ValueError('Same versionCode with different APK. Increase APK versionCode.')
              return {
                  'packageName': PACKAGE,
                  'versionCode': version_code,
                  'versionName': version,
                  'apkUrl': url,
                  'sizeBytes': total,
                  'notes': body,
                  'sha256': sha256,
              }


          def main():
              repo = os.environ['GITHUB_REPOSITORY']
              tag = os.environ['RELEASE_TAG']
              token = os.environ['GH_TOKEN']
              if not TAG_PATTERN.fullmatch(tag):
                  raise SystemExit('Release tag must be like v7.9.265; store-* releases are ignored.')
              path = Path('update.json')
              if not path.is_file():
                  raise SystemExit('Missing existing update.json; refusing to create a new unknown format.')
              previous = json.loads(path.read_text(encoding='utf-8'))
              if previous.get('packageName') != PACKAGE:
                  raise SystemExit('Unexpected packageName in existing update.json.')
              sdk = Path(os.environ['ANDROID_HOME']) / 'build-tools' / '35.0.0'
              release = load_release(repo, tag, token)
              data = build_metadata(release, repo, tag, sdk / 'aapt', sdk / 'apksigner', previous)
              if data == previous:
                  print('update.json is already current; no changes required.')
                  return
              path.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
              print(f"Prepared update.json: {data['versionName']} (versionCode {data['versionCode']})")
              print('SHA-256:', data['sha256'])
              print('APK size:', data['sizeBytes'])


          if __name__ == '__main__':
              main()
          PYTHON

      - name: Commit validated update.json
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add update.json
          if git diff --cached --quiet; then
            echo 'No update.json changes'
            exit 0
          fi
          git commit -m "Update main application metadata from release"
          git pull --rebase origin main
          git push origin HEAD:main
